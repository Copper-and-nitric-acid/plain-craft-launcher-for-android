name: Sync to Gitee

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0点（北京时间早8点）自动同步
  workflow_dispatch:    # 允许你随时手动点击触发

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: 'github/Copper-and-nitric'
          dst: 'gitee/copper-and-nitric-acid'
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          account_type: 'org'
          static_list: "plain-craft-launcher-for-android"
          force_update: true
